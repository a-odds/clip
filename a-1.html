<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>วิดีโอ</title>
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://img.icons8.com/color/96/rock-music.png">
  <style>
    body {
      background: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    video {
      max-width: 90%;
      max-height: 80vh;
    }
    .controls {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }
    button {
      padding: 8px 16px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- ใส่ URL วิดีโอจริงของคุณใน src -->
  <video id="myVideo" controls>
    <source src="https://pub-ea49601f030f4121ad3ed3d018d040cf.r2.dev/%E0%B8%84%E0%B8%A3%E0%B8%B6%E0%B9%88%E0%B8%87%E0%B8%AB%E0%B8%A5%E0%B8%B1%E0%B8%87%20by%20A.mp4">
  </video>

  <!-- ปุ่มตามที่สั่ง: วนซ้ำ และ ย้อน 10 วิ ไว้ด้านซ้าย -->
  <div class="controls">
    <button onclick="document.getElementById('myVideo').currentTime -= 10">ย้อน 10 วิ</button>
    <button id="loopBtn" onclick="toggleLoop()">วนซ้ำ: ปิด</button>
  </div>

  <script>
    const vid = document.getElementById('myVideo');
    const loopBtn = document.getElementById('loopBtn');

    function toggleLoop() {
      vid.loop = !vid.loop;
      loopBtn.innerText = vid.loop ? "วนซ้ำ: เปิด" : "วนซ้ำ: ปิด";
    }
  </script>

</body>
</html>
